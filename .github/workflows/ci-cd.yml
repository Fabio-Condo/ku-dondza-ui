name: CI/CD Pipeline

#on:
#  push:
#    branches:
#      - main
#  pull_request:
#    branches:
#      - main

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install dependencies
      run: npm install

    #- name: Run tests
    #  run: npm test

    - name: Build Angular app
      run: npm run build --prod

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/kudondza-ui:v1 .
        docker push ${{ secrets.DOCKER_USERNAME }}/kudondza-ui:v1

    #- name: Deploy with Docker Compose
    #  run: docker-compose up -d

    # Depois de fazer uma actualizacao, baixa a nova versao e corra com docker-compose
    # docker pull fabiocondo/kudondza-ui
    # docker-compose up -d