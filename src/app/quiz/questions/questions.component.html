<div class="container" style="margin-top: 70px;">
    <h1 class="quiz-title">Quiz: {{ quiz.title }}</h1>

    <div class="flex header-section">
        <div>
            <button *ngIf="isAdmin" (click)="onAddNewQuestion()" class="add-new">Adicionar perguntas</button>
        </div>
    </div>

    <div>
        <div class="question-card" *ngIf="currentQuestionIndex < questions.length">

            <img *ngIf="questions[currentQuestionIndex].urlFile" 
                 src="{{ questions[currentQuestionIndex].urlFile }}" 
                 alt="Gráfico de funções" 
                 class="question-graph">

            <h2 class="question-text">{{ questions[currentQuestionIndex].text }}</h2>

            <div class="answer-options">
                <label *ngFor="let answer of questions[currentQuestionIndex].answers">
                    <input 
                        type="radio" 
                        name="question-{{ questions[currentQuestionIndex].id }}" 
                        [value]="answer.id" 
                        [checked]="isSelected(questions[currentQuestionIndex].id, answer.id!)" 
                        (change)="captureUserAnswer(questions[currentQuestionIndex].id, answer.id!)" />
                    {{ answer.text }}
                </label>
            </div>

            <a (click)="onUpdateQuestion(questions[currentQuestionIndex])" class="edit-link">editar</a>
            <a class="delete-link">excluir</a>
        </div>

        <div class="navigation-buttons text-center">
            <button class="pagination-button" (click)="goToPreviousQuestion()" [disabled]="currentQuestionIndex === 0">
                <i class="pi pi-chevron-left"></i> Anterior
            </button>
            <button class="pagination-button" (click)="goToNextQuestion()" 
                    [disabled]="currentQuestionIndex === questions.length - 1">
                Próxima <i class="pi pi-chevron-right"></i>
            </button>
        </div>
    </div>

    <br>

    <!-- O botão de submissão só aparece quando todas as perguntas foram visualizadas -->
    <div *ngIf="currentQuestionIndex === questions.length - 1" class="text-center">
        <button class="submit-button" (click)="submitAnswers()">Submeter Respostas</button>
    </div>

    <div *ngIf="showLoading" class="loading-indicator">
        Carregando...
    </div>
</div>

<div class="overlay" *ngIf="displayModalSave">
    <div class="dialog">
        <h2>{{ editing ? 'Editando Quiz' : 'Adicionando Novo Quiz' }}</h2>
        <button class="close-btn" (click)="displayModalSave = false">&times;</button>

        <form autocomplete="off" #questionForm="ngForm" (ngSubmit)="save(questionForm)">
            <div class="form-group">
                <label>Texto da pergunta</label>
                <input type="text" 
                       id="questionText" 
                       name="text" 
                       ngModel 
                       #text="ngModel" 
                       required 
                       minlength="1" 
                       [(ngModel)]="question.text" />
            </div>

            <input *ngIf="!editingAnswer" 
                   (change)="onUpdateQuestionImage(question, $event)" 
                   type="file" 
                   id="cover-upload" 
                   class="upload-input" 
                   accept="image/*">

            <div class="answers-container">
                <div class="header-section">
                    <label>Respostas</label>
                    <a href="javascript:;" class="add-new" (click)="getReadyNewAnswer()">Adicionar novo</a>
                </div>

                <p-table [value]="question.answers" selectionMode="single" [responsive]="true" class="answers-table">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>Texto</th>
                            <th>É a correta?</th>
                            <th>Ações</th>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="body" let-answer let-rowIndex="rowIndex">
                        <tr [pSelectableRow]="answer">
                            <td>{{ answer.text }}</td>
                            <td>{{ answer.correct ? 'Sim' : 'Não' }}</td>
                            <td class="actions">
                                <a href="javascript:;" (click)="getReadyAnswerEdit(answer, rowIndex)" class="edit-btn">
                                    <i class="pi pi-pencil"></i> Editar
                                </a>
                                <a href="javascript:;" (click)="removeAnswer(rowIndex)" class="remove-btn">
                                    <i class="pi pi-trash"></i> Remover
                                </a>
                            </td>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="emptymessage">
                        <tr>
                            <td colspan="3" class="text-center">Sem respostas</td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>

            <button type="submit" [disabled]="questionForm.invalid" class="btn">
                {{ showLoading ? 'Loading...' :'Salvar' }}
            </button>
        </form>
    </div>
</div>

<p-dialog [header]="editingAnswer ? 'Edição' : 'Novo'" [(visible)]="showAnswerForm" [modal]="true" *ngIf="answer">
    <form #frmAnswer="ngForm" (ngSubmit)="confirmAnswer(frmAnswer)">
        <div class="col-12 p-fluid">
            <label for="text">Texto</label>
            <input pInputText 
                   type="text" 
                   id="text" 
                   name="text" 
                   required 
                   [(ngModel)]="answer.text" 
                   #textModel="ngModel" 
                   placeholder="Digite a resposta" />
        </div>
        <div class="col-12 p-fluid">
            <label for="correct">É a correta?</label>
            <p-dropdown id="correct" 
                         [options]="[{label: 'Sim', value: true}, {label: 'Não', value: false}]"
                         [(ngModel)]="answer.correct" 
                         name="correct" 
                         placeholder="Selecione uma opção"></p-dropdown>
        </div>
        <div class="col-12 p-fluid">
            <button pButton type="submit" label="Confirmar" 
                    [disabled]="frmAnswer.invalid" 
                    style="height: 30px; margin-top: 1%;"></button>
        </div>
    </form>
</p-dialog>
