<div class="container" style="margin-top: 70px;">
    <div style="display:inline;">
        <h1 class="title">{{ quiz.title }}</h1>
    </div>

    <div class="flex">
        <div>
            <a *ngIf="isAdmin" (click)="onAddNewQuestion()" class="ml-left">Adicionar</a>
        </div>

        <div class="input-group">
            <div class="input-container">
                <i class="pi pi-search input-icon"></i> <!-- Ícone de pesquisa -->

                <input type="text" id="input" class="transparent-input" placeholder="Pesquisa">
            </div>
        </div>
    </div>

    <table class="card-table">
        <tbody>
            <tr *ngFor="let question of questions">
                <td>
                    <div class="card">
                        <div class="card-content">
                            <div class="content">
                                <p class="subject-name">{{ question.text }}</p>
                                <p class="details">duração: {{ question.quiz.title }}</p>
                                <a (click)="onUpdateQuestion(question)" class="edit-link">editar</a>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Indicador de carregamento -->
    <div *ngIf="showLoading" class="loading-indicator">
        Carregando...
    </div>
</div>

<div class="overlay" *ngIf="displayModalSave">
    <div class="dialog">
        <h2>{{ editing ? 'Editando Quiz' : 'Adicionando Novo Quiz' }}</h2>
        <button class="close-btn" (click)="displayModalSave = false">&times;</button>

        <form autocomplete="off" #questionForm="ngForm" (ngSubmit)="save(questionForm)">
            <div class="form-group">
                <label for="questionText">Text</label>
                <input type="text" id="questionText" type="text" name="text" ngModel #text="ngModel" required
                    minlength="1" [(ngModel)]="question.text" required>
            </div>
            <button type="submit" [disabled]="questionForm.invalid" class="btn">{{ showLoading ? 'Loading...' :
                'Salvar'
                }}</button>

        </form>
    </div>
</div>
