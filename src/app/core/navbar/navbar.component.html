<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dikahub - Plataforma Acadêmica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #f8f9fa;
      color: #333;
      line-height: 1.6;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav {
      height: 60px;
      align-items: center;
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      z-index: 1000;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(230, 230, 230, 0.7);
      padding: 10px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 22px;
      font-weight: 700;
      color: #4361ee;
      letter-spacing: -1px;
    }

    .logo-icon {
      margin-right: 10px;
      background: linear-gradient(135deg, #4361ee, #6c47ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 24px;
      width: 30px;
      height: 30px;
      /* Diminuindo o tamanho do ícone */
    }

    .logo::before {
      /* content: '🎓';*/
      margin-right: 10px;
      font-size: 24px;
      /* Diminuindo o tamanho do emoji */
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 24px;
      /* Reduzindo o espaçamento entre os links */
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      position: relative;
      padding-bottom: 3px;
      /* Reduzindo o padding */
      transition: all 0.3s ease;
      font-size: 14px;
      /* Diminuindo o tamanho da fonte */
    }

    .nav-links a:hover {
      color: #4361ee;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background: linear-gradient(90deg, #4361ee, #6c47ff);
      transition: width 0.3s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a.active {
      color: #4361ee;
    }

    .nav-links a.active::after {
      width: 100%;
    }

    .right-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .auth-buttons {
      display: flex;
      gap: 12px;
      /* Reduzindo o espaçamento entre os botões */
    }

    .btn {
      padding: 8px 18px;
      /* Reduzindo o padding dos botões */
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
      border: none;
      letter-spacing: -0.2px;
      font-size: 14px;
      /* Reduzindo o tamanho da fonte */
    }

    .btn-outline {
      border: 2px solid #4361ee;
      color: #4361ee;
      background: transparent;
    }

    .btn-outline:hover {
      background-color: rgba(67, 97, 238, 0.05);
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.15);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #4361ee, #6c47ff);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #3b4fd3, #5d3de0);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.25);
    }

    .user-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4361ee;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .user-icon:hover {
      background: #e6e8eb;
    }

    .mobile-toggle {
      display: none;
      font-size: 22px;
      /* Diminuindo o tamanho do ícone de menu */
      cursor: pointer;
      color: #4361ee;
      background: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .mobile-toggle:hover {
      background-color: rgba(67, 97, 238, 0.1);
    }

    .mobile-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4361ee, #6c47ff);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform: translateY(-100%);
      transition: transform 0.4s cubic-bezier(0.76, 0, 0.24, 1);
      overflow-y: auto;
    }

    .mobile-menu.active {
      transform: translateY(0);
    }

    .mobile-menu .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      font-size: 28px;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mobile-menu .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    .mobile-nav-links {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }

    .mobile-nav-links li {
      margin: 20px 0;
      /* Reduzindo a margem */
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.4s ease;
    }

    .mobile-menu.active .mobile-nav-links li {
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-menu.active .mobile-nav-links li:nth-child(1) {
      transition-delay: 0.1s;
    }

    .mobile-menu.active .mobile-nav-links li:nth-child(2) {
      transition-delay: 0.2s;
    }

    .mobile-menu.active .mobile-nav-links li:nth-child(3) {
      transition-delay: 0.3s;
    }

    .mobile-menu.active .mobile-nav-links li:nth-child(4) {
      transition-delay: 0.4s;
    }

    .mobile-menu.active .mobile-nav-links li:nth-child(5) {
      transition-delay: 0.5s;
    }

    .mobile-menu.active .mobile-nav-links li:nth-child(6) {
      transition-delay: 0.6s;
    }

    .mobile-nav-links a {
      text-decoration: none;
      color: white;
      font-size: 24px;
      /* Reduzindo o tamanho da fonte */
      font-weight: 600;
      letter-spacing: -0.5px;
      transition: all 0.3s ease;
      padding: 8px 20px;
      border-radius: 12px;
    }

    .mobile-nav-links a:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .mobile-nav-links a.active {
      background: rgba(255, 255, 255, 0.1);
    }

    .mobile-nav-links a.active::after {
      width: 100%;
    }

    .mobile-auth-buttons {
      margin-top: 36px;
      /* Reduzindo a margem */
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 200px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease 0.6s;
    }

    .mobile-menu.active .mobile-auth-buttons {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-auth-buttons .btn {
      font-size: 16px;
      text-align: center;
      padding: 12px;
      /* Reduzindo o padding */
    }

    .mobile-auth-buttons .btn-white {
      background-color: white;
      color: #4361ee;
      font-weight: 600;
    }

    .mobile-auth-buttons .btn-white:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
    }

    .mobile-auth-buttons .btn-outline {
      border: 2px solid white;
      color: white;
    }

    .mobile-auth-buttons .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    @media (max-width: 992px) {
      .nav-links {
        gap: 16px;
      }
    }

    @media (max-width: 768px) {
      .mobile-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .nav-links,
      .auth-buttons {
        display: none;
      }

      /* Manter o ícone de usuário visível no mobile */
      .user-icon {
        width: 32px;
        height: 32px;
        font-size: 14px;
      }
    }

    @media (max-width: 576px) {
      .logo {
        font-size: 20px;
      }

      .logo::before {
        font-size: 22px;
      }

      .mobile-nav-links a {
        font-size: 22px;
      }

      .container {
        padding: 0 16px;
      }

      nav {
        height: 56px;
        /* Reduzindo ainda mais para telas menores */
      }
    }
  </style>
</head>

<body>
  <header>

    <nav>
      <div class="container">
        <div class="logo">
          <span class="logo-icon">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="7" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </span>
          dikahub
        </div>
        <ul class="nav-links">
          <li><a [class.active]="isActive('/main-panel')" routerLink="/main-panel">Início</a></li>
          <li><a [class.active]="isActive('/courses')" routerLink="/courses">Cursos</a></li>
          <li><a [class.active]="isActive('/books')" routerLink="/books">Biblioteca</a></li>
          <li><a [class.active]="isActive('/questions')" routerLink="/questions">Questões</a></li>
          <li><a [class.active]="isActive('/quizzes')" routerLink="/quizzes">Quizzes</a></li>
          <li><a [class.active]="isActive('/test')" routerLink="/test">Pessoas</a></li>
        </ul>
        <div class="right-section">
          <div class="auth-buttons" *ngIf="showNavButtons()">
            <a routerLink="/login" class="btn btn-outline">Login</a>
            <a routerLink="/login" class="btn btn-primary">Cadastre-se</a>
          </div>
          <div class="auth-buttons" *ngIf="!showNavButtons()">
            <a routerLink="/quizzes/new" class="btn btn-primary">Iniciar Quiz</a>
          </div>
          <img [src]="loggedUser.profileImageUrl" alt="Foto de perfil" class="user-icon"
            (click)="goToProfile()" *ngIf="!showNavButtons() && loggedUser.profileImageUrl" />
          <div class="user-icon" (click)="goToProfile()" *ngIf="!showNavButtons()  && !loggedUser.profileImageUrl">
            <i class="fas fa-user"></i>
          </div>
          <button class="mobile-toggle" id="mobile-toggle" (click)="toggleMenu()">☰</button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Mobile Menu -->
  <div class="mobile-menu" id="mobile-menu" [class.active]="isMenuActive">
    <button class="close-btn" id="close-menu" (click)="toggleMenu()">✕</button>
    <ul class="mobile-nav-links">
      <li><a [class.active]="isActive('/main-panel')" routerLink="/main-panel" (click)="toggleMenu()">Início</a></li>
      <li><a [class.active]="isActive('/courses')" routerLink="/courses" (click)="toggleMenu()">Cursos</a></li>
      <li><a [class.active]="isActive('/books')" routerLink="/books" (click)="toggleMenu()">Biblioteca</a></li>
      <li><a [class.active]="isActive('/questions')" routerLink="/questions" (click)="toggleMenu()">Questões</a></li>
      <li><a [class.active]="isActive('/quizzes')" routerLink="/quizzes" (click)="toggleMenu()">Quizzes</a></li>
      <li><a href="#">Sobre</a></li>
    </ul>
    <div class="mobile-auth-buttons" *ngIf="showNavButtons()">
      <a routerLink="/login" class="btn btn-white">Login</a>
      <a routerLink="/login" class="btn btn-outline">Cadastre-se</a>
    </div>
  </div>
</body>

</html>
