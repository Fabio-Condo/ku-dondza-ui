<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

<nav>
  <div class="container">
    <div class="nav-left">
      <h2 class="logo" style="color: white;">Ku-DONDZA</h2>
      <div class="search-bar">
        <i class="pi pi-search"></i>
        <input type="search" placeholder="Search" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()" />
        <div class="search-results-popup" *ngIf="searchQuery.length > 2 && results.length > 0">
          <ul>
            <li *ngFor="let result of results">
              <div class="profile-pic">
                <a (click)="goToProfile()">
                  <img src="{{result.urlFile}}" alt="Profile picture" />
                </a>
              </div>
              <span>{{ result.type }}: </span>
              <span>{{ result.content }}</span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    
    <div class="create" *ngIf="isUserLoggedIn">
      <!-- Botão grande do menu -->
      <div class="menu-button">
        <button (click)="toggleMenu()" class="menu-icon">
          <!--<i class="pi pi-bars"></i>-->
          <i class="fas fa-th"></i>
        </button>

        <!-- Menu dropdown grande -->
        <div class="menu-dropdown large" [class.active]="isMenuActive">
          <ul (click)="toggleMenu()">
            <li [class.active]="isActive('/feed')" routerLink="/feed" >
              <a class="menu-item">Feed</a>
            </li>
            <li [class.active]="isActive('/instituicoes')" routerLink="/instituicoes">
              <a class="menu-item">Instituições
              </a>
            </li>
            <li [class.active]="isActive('/cursos')" routerLink="/cursos">
              <a class="menu-item">Cursos</a>
            </li>
            <li [class.active]="isActive('/coursos-online')" routerLink="/coursos-online">
              <a class="menu-item">Cursos online</a>
            </li>
            <li [class.active]="isActive('/exames')" routerLink="/exames">
              <a class="menu-item">Exames</a>
            </li>
            <li [class.active]="isActive('/quizzes')" routerLink="/quizzes">
              <a class="menu-item">Quizzes</a>
            </li>
            <li [class.active]="isActive('/grupos')" routerLink="/grupos">
              <a class="menu-item">Grupos</a>
            </li>
            <li [class.active]="isActive('/users')" routerLink="/users">
              <a class="menu-item">Usuários</a>
            </li>
          </ul>
        </div>
      </div>
      <div class="profile-pic">
        <a (click)="goToProfile()">
          <img src="{{loggedUser.profileImageUrl}}" alt="Profile picture" />
        </a>
      </div>
    </div>
  </div>
</nav>
