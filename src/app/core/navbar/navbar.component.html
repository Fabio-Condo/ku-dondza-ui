<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

<nav>
  <div class="container">
    <div class="nav-left">
      <h2 class="logo" style="color: white;">Dika-Hub</h2>
    </div>

    <div class="create">
      <div class="menu-button">

        <!--
        <button *ngIf="isUserLoggedIn" (click)="togglePopout();" class="menu-icon" routerLink="/notifications">
          <i class="fas fa-bell"></i>
          <span class="notification-count" *ngIf="unreadNotificationsCount > 0">{{ unreadNotificationsCount }}</span>
        </button>
        -->

        <button *ngIf="isUserLoggedIn" (click)="toggleMenu()" class="menu-icon">
          <i class="fas fa-th"></i>
        </button>

        <!--<button class="btn" *ngIf="!isUserLoggedIn" (click)="onLogIn()">Iniciar sessão</button>-->

        <div class="menu-dropdown large" [class.active]="isMenuActive">
          <div class="menu-title">Menu</div>
          <ul (click)="toggleMenu()">

            <li [class.active]="isActive('/coursos-online')" routerLink="/coursos-online">
              <div class="menu-content">
                <span class="menu-icon-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                  </svg>
                </span>
                <a class="menu-item">
                  <span>Cursos</span>
                </a>
              </div>
            </li>
            
            <li [class.active]="isActive('/quizzes')" routerLink="/quizzes">
              <div class="menu-content">
                <span class="menu-icon-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EA4335" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                </span>
                <a class="menu-item">
                  <span>Histórico De Quizzes</span>
                </a>
              </div>
            </li>
            
            <li [class.active]="isActive('/questions')" routerLink="/questions">
              <div class="menu-content">
                <span class="menu-icon-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FBBC05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    <line x1="12" y1="6" x2="16" y2="6"></line>
                    <line x1="12" y1="10" x2="16" y2="10"></line>
                    <line x1="12" y1="14" x2="16" y2="14"></line>
                  </svg>
                </span>
                <a class="menu-item">
                  <span>Repositório De Questões</span>
                </a>
              </div>
            </li>
            
            <li [class.active]="isActive('/books')" routerLink="/books">
              <div class="menu-content">
                <span class="menu-icon-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34A853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                  </svg>
                </span>
                <a class="menu-item">
                  <span>Livros</span>
                </a>
              </div>
            </li>

            <!--
            <li [class.active]="isActive('/competitions')" routerLink="/competitions">
              <div class="menu-content">
                <span class="menu-icon-item">🏆</span>
                <a class="menu-item">
                  <span>Competições</span>
                </a>
              </div>
            </li>
            -->

          </ul>
        </div>
      </div>

      <div class="profile-pic" *ngIf="isUserLoggedIn">
        <a (click)="goToProfile()">
          <img src="{{loggedUser.profileImageUrl}}" alt="Profile picture" />
        </a>
      </div>
    </div>
  </div>
</nav>
