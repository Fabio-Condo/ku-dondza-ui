<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

<nav>
  <div class="container">
    <div class="nav-left">
      <h2 class="logo" style="color: white;">Ku-DONDZA</h2>
    </div>

    <div class="create">
      <div class="menu-button">

        <button *ngIf="isUserLoggedIn" (click)="togglePopout();" class="menu-icon" routerLink="/notifications">
          <i class="fas fa-bell"></i>
          <span class="notification-count" *ngIf="unreadNotificationsCount > 0">{{ unreadNotificationsCount }}</span>
        </button>

        <button *ngIf="isUserLoggedIn" (click)="toggleMenu()" class="menu-icon">
          <i class="fas fa-th"></i>
        </button>

        <button class="btn" *ngIf="!isUserLoggedIn" (click)="onLogIn()">Iniciar sessão</button>


        <div class="menu-dropdown large" [class.active]="isMenuActive">
          <div class="menu-title">Menu</div>
          <ul (click)="toggleMenu()">

            <li [class.active]="isActive('/coursos-online')" routerLink="/coursos-online">
              <div class="menu-content">
                <span class="menu-icon-item">💻</span>
                <a class="menu-item">
                  <span>Cursos Online</span>
                </a>
              </div>
            </li>

            <li [class.active]="isActive('/quizzes')" routerLink="/quizzes">
              <div class="menu-content">
                <span class="menu-icon-item">❓</span>
                <a class="menu-item">
                  <span>Quizzes</span>
                </a>
              </div>
            </li>

            <li [class.active]="isActive('/questions')" routerLink="/questions">
              <div class="menu-content">
                <span class="menu-icon-item">📚</span>
                <a class="menu-item">
                  <span>Reposiório De Questões</span>
                </a>
              </div>
            </li>

            <li [class.active]="isActive('/books')" routerLink="/books">
              <div class="menu-content">
                <span class="menu-icon-item">📚</span>
                <a class="menu-item">
                  <span>Livros</span>
                </a>
              </div>
            </li>

            <!--
            <li [class.active]="isActive('/competitions')" routerLink="/competitions">
              <div class="menu-content">
                <span class="menu-icon-item">🏆</span>
                <a class="menu-item">
                  <span>Competições</span>
                </a>
              </div>
            </li>
            -->

          </ul>
        </div>
      </div>

      <div class="profile-pic" *ngIf="isUserLoggedIn">
        <a (click)="goToProfile()">
          <img src="{{loggedUser.profileImageUrl}}" alt="Profile picture" />
        </a>
      </div>
    </div>
  </div>
</nav>
