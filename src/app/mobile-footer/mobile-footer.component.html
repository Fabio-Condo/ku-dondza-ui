<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Mobile Fixo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Footer fixo para mobile */
        .mobile-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding: 8px 0 6px 0;
            z-index: 1000;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            display: block;
        }

        /* Esconder no desktop */
        @media (min-width: 769px) {
            .mobile-footer {
                display: none;
            }
        }

        .footer-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 20px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #666;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 8px 4px;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 12px;
            z-index: -1;
        }

        .nav-item:hover::before,
        .nav-item.active::before {
            opacity: 0.1;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        /*
        .nav-item:hover .nav-icon,
        .nav-item.active .nav-icon {
            transform: translateY(-2px) scale(1.1);
            filter: drop-shadow(0 4px 8px rgba(102, 126, 234, 0.3));
        }
        */

        .nav-text {
            font-size: 11px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .nav-item:hover .nav-text,
        .nav-item.active .nav-text {
            color: #667eea;
            font-weight: 600;
            transform: translateY(-1px);
        }

        /* Animação de pulso para item ativo */
        .nav-item.active {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Indicador de notificação */
        .nav-item .notification-dot {
            position: absolute;
            top: 4px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border-radius: 50%;
            border: 2px solid white;
            animation: bounce 2s infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-item.has-notification .notification-dot {
            opacity: 1;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-4px);
            }

            60% {
                transform: translateY(-2px);
            }
        }

        /* Responsividade para diferentes tamanhos de mobile */
        @media (max-width: 380px) {
            .footer-nav {
                padding: 0 10px;
            }

            .nav-item {
                padding: 6px 2px;
            }

            .nav-icon {
                width: 20px;
                height: 20px;
            }

            .nav-text {
                font-size: 10px;
            }
        }

        /* Efeito de ondulação ao tocar */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <footer class="mobile-footer">
        <nav class="footer-nav">

                </svg>

            -->
        </nav>
    </footer>
</body>
