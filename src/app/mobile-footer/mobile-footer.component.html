<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer Mobile Fixo</title>
    <style>
        /* footer.component.css */
        :host {
            --accent: #6C63FF;
            --accent-soft: rgba(108, 99, 255, 0.12);
        }

        .mobile-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            height: 72px;
            z-index: 1000;
            display: block;
        }

        @media (min-width: 769px) {
            .mobile-footer {
                display: none;
            }
        }

        .footer-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100%;
            padding: 0 8px;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            color: #9e9ea7;
            padding: 8px 4px;
            border-radius: 14px;
            position: relative;
            transition: color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-pill {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 28px;
            height: 3px;
            background: var(--accent);
            border-radius: 0 0 2px 2px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item.active .nav-pill {
            transform: translateX(-50%) scaleX(1);
        }

        .icon-wrap {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: background 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .nav-item.active .icon-wrap {
            background: var(--accent-soft);
            transform: translateY(-2px);
        }

        .nav-item:active .icon-wrap {
            transform: scale(0.88);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
        }

        .nav-text {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.01em;
            line-height: 1;
            transition: color 0.2s;
        }

        .notification-dot {
            position: absolute;
            top: 1px;
            right: 1px;
            width: 7px;
            height: 7px;
            background: #FF4757;
            border-radius: 50%;
            border: 1.5px solid #ffffff;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .has-notification .notification-dot {
            opacity: 1;
        }

        @media (max-width: 380px) {
            .nav-icon {
                width: 18px;
                height: 18px;
            }

            .nav-text {
                font-size: 9px;
            }
        }
    </style>
</head>

<body>
    <!-- footer.component.html -->
    <footer class="mobile-footer">
        <nav class="footer-nav">

            <a [class.active]="isActive('/progress')" routerLink="/progress" class="nav-item" data-section="progresso">
                <div class="nav-pill"></div>
                <div class="icon-wrap">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="4" y="10" width="3" height="10" rx="1.5" />
                        <rect x="10.5" y="6" width="3" height="14" rx="1.5" />
                        <rect x="17" y="13" width="3" height="7" rx="1.5" />
                    </svg>
                    <div class="notification-dot"></div>
                </div>
                <span class="nav-text">Progresso</span>
            </a>

            <a [class.active]="isActive('/quizzes')" routerLink="/quizzes" class="nav-item" data-section="quizzes">
                <div class="nav-pill"></div>
                <div class="icon-wrap">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 2-2.5 2.5-2.5 4" />
                        <circle cx="12" cy="17.5" r=".5" fill="currentColor" stroke="none" />
                    </svg>
                    <div class="notification-dot"></div>
                </div>
                <span class="nav-text">Quizzes</span>
            </a>

            <a [class.active]="isActive('/subjects')" routerLink="/subjects" class="nav-item"
                data-section="disciplinas">
                <div class="nav-pill"></div>
                <div class="icon-wrap">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                    </svg>
                    <div class="notification-dot"></div>
                </div>
                <span class="nav-text">Materiais</span>
            </a>

            <a [class.active]="isActive('/exames')" routerLink="/exames" class="nav-item" data-section="exames">
                <div class="nav-pill"></div>
                <div class="icon-wrap">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" />
                        <line x1="9" y1="7" x2="15" y2="7" />
                        <line x1="9" y1="11" x2="15" y2="11" />
                        <line x1="9" y1="15" x2="12" y2="15" />
                    </svg>
                    <div class="notification-dot"></div>
                </div>
                <span class="nav-text">Exames</span>
            </a>

        </nav>
    </footer>
</body>

</html>
