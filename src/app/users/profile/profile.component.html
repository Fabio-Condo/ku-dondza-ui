<body>
    <div *ngIf="showLoading" class="loading-container visible" aria-live="polite">
        <div class="loading-indicator">
            <div class="spinner"></div>
            <div class="loading-text">
                {{ loadingMessage || 'Carregando' }}<span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    </div>

    <div class="container">

        <!-- routerLink="/users" -->
        <button class="go-back-btn" routerLink="/quizzes">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>
            Voltar
        </button>

        <div class="profile-card">
            <div class="banner">
                <button class="edit-button" (click)="onUpdateCurrentUser()" *ngIf="currentUser.userId == user.userId">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
            <div class="profile-content">
                <div class="profile-header">
                    <div class="profile-pic">
                        <i *ngIf="!user.profileImageUrl" class="fas fa-user" style="font-size: 3rem;"></i>
                        <img *ngIf="user.profileImageUrl" src="{{user.profileImageUrl}}" id="profile-photo" type="file"
                            alt="Foto do Perfil">
                        <label *ngIf="currentUser.userId == user.userId" for="profile-upload"
                            class="upload-button">Trocar</label>
                        <input *ngIf="currentUser.userId == user.userId" (change)="onProfilePhotoFileChange($event)"
                            type="file" id="profile-upload" class="upload-input" accept="image/*">
                    </div>
                    <div class="profile-info">
                        <h1>{{ user.fullName }}</h1>
                        <p>{{ user.bio }}</p>
                    </div>
                </div>

                <div class="profile-details">
                    <div>
                        <!--
                        <div class="detail-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>São Paulo, Brasil</span>
                        </div>
                        -->
                        <div class="detail-item" *ngIf="isSuperAdmin">
                            <i class="fas fa-envelope"></i>
                            <span>{{ user.email }}</span>
                        </div>
                        <!--
                        <div class="detail-item">
                            <i class="fas fa-calendar"></i>
                            <span>Membro desde Março 2024</span>
                        </div>
                        -->
                    </div>
                    <button class="btn-outline" id="logout-btn" (click)="onLogOut()"
                        *ngIf="currentUser.userId == user.userId">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                </div>

                <!--
            <div class="badges">
                <span class="badge">Especialista</span>
                <span class="badge">Top Criadora</span>
                <span class="badge">Mentora</span>
            </div>
            -->
            </div>
        </div>

<div class="popout-overlay" *ngIf="displayModalSave">
    <div class="popout-container">
        <div class="popout-header">
            <h2 class="popout-title">Editar Perfil</h2>
            <button class="close-button" (click)="displayModalSave = false">&times;</button>
        </div>

        <form autocomplete="off" #userForm="ngForm" (ngSubmit)="update(userForm)">
            <div class="form-group">
                <label class="form-label" for="fullName">Nome</label>
                <input class="form-input" [(ngModel)]="user.fullName" type="text" id="fullName" name="fullName">
            </div>

            <!--
            <div class="form-group">
                <label class="form-label" for="lastName">Apélido</label>
                <input class="form-input" [(ngModel)]="user.lastName" type="text" id="lastName" name="lastName">
            </div>
            -->

            <div class="form-group">
                <label class="form-label" for="bio">Título ou Bio</label>
                <textarea class="form-input form-textarea" [(ngModel)]="user.bio" id="bio" name="bio"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-input" disabled [(ngModel)]="user.email" type="email" id="email" name="email">
            </div>

            <!--
            <div class="form-group">
                <label class="form-label" for="location">Localização</label>
                <input class="form-input" type="text" id="location" name="location">
            </div>
            -->

            <!--
            <div class="form-group">
                <label class="form-label">Disciplinas de Interesse</label>
                <div class="tags-container">
                    <div class="tag" *ngFor="let interest of user.subjectsInterests">
                        {{ interest.name }}
                        <button type="button" class="tag-remove" (click)="removeInterest(interest)">&times;</button>
                    </div>
                    <input class="add-tag-input" type="text" placeholder="Adicionar disciplina...">
                </div>
            </div>
            -->

            <button type="submit" class="submit-button" [disabled]="userForm.invalid">
                {{ showLoading ? 'Loading...' :'Salvar' }}
            </button>
        </form>
    </div>
</div>
