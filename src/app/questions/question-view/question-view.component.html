<div class="container" style="margin-top: 70px;">
    <h1 style=" font-size: 20px; color: var(--color-black); text-transform: capitalize; font-weight: 600; position: relative; margin-bottom: 1px;">
        {{ question.topic.subject.name }}
    </h1>
    <p style="font-size: 12px; color: black; text-decoration: none; font-weight: 300; display: block; transition: all 0.3s ease; margin-bottom: 10px;">
        {{question.topic.name}}
    </p>
    <p style="font-size: 12px; color: black; text-decoration: none; font-weight: 300; display: block; transition: all 0.3s ease">
        {{question.text}}
    </p>
    <img *ngIf="question.urlFile" src="{{ question.urlFile }}" alt="Gráfico de funções" class="question-graph">

    <h1 style=" font-size: 14px; color: var(--color-black); text-transform: capitalize; font-weight: 600; position: relative; margin-bottom: 5px;">
        Opcoes de respostas
    </h1>
    <label *ngFor="let answer of question.answers">
        <span>{{answer.text}}</span>
        <span> {{answer.correct}}</span>
        <br>
    </label>

</div>
