<div class="question-card">
    <!-- Cabeçalho da pergunta -->
    <div class="question-header">
        <h1 class="subject-name">{{ question.topic.subject.name }}</h1>
        <p class="topic-name">{{ question.topic.name }}</p>
    </div>

    <!-- Corpo da pergunta -->
    <div class="question-body">
        <h2 class="question-title">Exercício</h2>
        <p class="details" *ngIf="question.text">
            \[{{ question.text }}\]
        </p>   
        
        <!-- Imagem da pergunta (se houver) -->
        <img *ngIf="question.urlFile" [src]="question.urlFile" alt="Gráfico de funções" class="question-image">
    </div>

    <!-- Opções de resposta -->
    <div class="answer-options">
        <h2 class="options-title">Opções de Resposta</h2>
        <div class="answers-grid">
            <label *ngFor="let answer of question.answers" class="answer-item">
                <span> \[{{ answer.text }}\] </span> 
                <span *ngIf="answer.correct" class="correct-tag">✓</span>
            </label>
        </div>
    </div>

    <!-- Botão para mostrar/ocultar a solução -->
    <div class="solution-toggle">
        <button (click)="toggleSolution()" class="toggle-button">
            {{ showSolution ? 'Ocultar Solução' : 'Mostrar Solução' }}
        </button>
    </div>

    <!-- Explicação da resolução -->
    <div class="solution-section" *ngIf="showSolution">
        <h2 class="solution-title">Como Resolver</h2>
        <div class="solution-content">
            <p class="solution-text">
                \[{{ question.text }}\]
            </p>
        </div>
    </div>
</div>
