<div class="search-container">
    <h1 class="search-title">Search Results for: {{ searchQuery }}</h1>
  
    <!-- Feedback para consultas pequenas -->
    <div *ngIf="searchQuery && searchQuery.length <= 2" class="search-feedback">
      <p>Please enter at least 3 characters to search.</p>
    </div>
  
    <!-- Resultados da pesquisa -->
    <div *ngIf="searchQuery && searchQuery.length > 2">
      <!-- Sem resultados -->
      <div *ngIf="results.length === 0" class="no-results">
        <p>No results found for "{{ searchQuery }}".</p>
      </div>
  
      <!-- Usuários -->
      <div *ngIf="userResults.length > 0">
        <h2 class="results-heading">Users</h2>
        <ul class="results-list">
          <li
            *ngFor="let result of userResults"
            [routerLink]="['/user/profile', result.id]"
            class="result-item"
          >
            <img [src]="result.urlFile || 'assets/default-user.png'" alt="Profile picture" class="result-image" />
            <span class="result-content">{{ result.content }}</span>
          </li>
        </ul>
      </div>
  
      <!-- Grupos -->
      <div *ngIf="groupResults.length > 0">
        <h2 class="results-heading">Groups</h2>
        <ul class="results-list">
          <li
            *ngFor="let result of groupResults"
            [routerLink]="['/groups', result.id]"
            class="result-item"
          >
            <img [src]="result.urlFile || 'assets/default-group.png'" alt="Group picture" class="result-image" />
            <span class="result-content">{{ result.content }}</span>
          </li>
        </ul>
      </div>
  
      <!-- Instituições -->
      <div *ngIf="institutionResults.length > 0">
        <h2 class="results-heading">Institutions</h2>
        <ul class="results-list">
          <li
            *ngFor="let result of institutionResults"
            [routerLink]="['/instituicoes', result.id]"
            class="result-item"
          >
            <img
              [src]="result.urlFile || 'assets/default-institution.png'"
              alt="Institution picture"
              class="result-image"
            />
            <span class="result-content">{{ result.content }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
