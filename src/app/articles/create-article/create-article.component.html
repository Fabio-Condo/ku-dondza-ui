<div class="form-container">

    <button class="go-back-btn" routerLink="/questions">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
        Voltar
    </button>

    <form autocomplete="off" #exameForm="ngForm" class="blog-form">
        <div class="form-group">
            <label for="title">Título</label>
            <input type="text" id="title" name="title" [(ngModel)]="article.title" minlength="1"
                placeholder="Digite o título do blog" class="form-input" />
        </div>

        <div class="form-group">
            <label for="category">Categoria</label>
            <select id="category" [(ngModel)]="article.category" name="category" required>
                <option value="" disabled selected>Selecione a categoria</option>
                <option *ngFor="let category of categoryTypes" [value]="category.value">{{ category.label }}</option>
            </select>
        </div>

        <div class="form-group">
            <label for="editor">Conteúdo</label>
            <textarea id="editor" name="editor" placeholder="Escreva o conteúdo do blog"
                class="form-textarea"></textarea>
        </div>

        <div class="form-group">
            <label for="title">Tempo de leitura em minutos</label>
            <input type="text" id="readingTimeMinutes" name="readingTimeMinutes" [(ngModel)]="article.readingTimeMinutes" minlength="1"
                placeholder="Tempo de leitura" class="form-input" />
        </div>

        <div class="form-group">
            <label for="file">Anexar PDF</label>
            <input type="file" (change)="onFileSelected($event)" name="file" accept="application/pdf"
                class="form-file" />
        </div>

        <div class="form-actions">
            <button type="button" (click)="newArticle()" class="btn btn-new">
                Novo
            </button>
            <button type="button" (click)="save()" class="btn btn-save">
                {{ showLoading ? 'Salvando...' : 'Salvar' }}
            </button>
        </div>
    </form>
</div>
