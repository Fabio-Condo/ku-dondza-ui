<div class="form-container">
    <form autocomplete="off" #exameForm="ngForm" class="blog-form">
      <div class="form-group">
        <label for="title">Título</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="article.title"
          minlength="1"
          placeholder="Digite o título do blog"
          class="form-input"
        />
      </div>
  
      <div class="form-group">
        <label for="editor">Conteúdo</label>
        <textarea
          id="editor"
          name="editor"
          placeholder="Escreva o conteúdo do blog"
          class="form-textarea"
        ></textarea>
      </div>
  
      <div class="form-group">
        <label for="file">Anexar PDF</label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          name="file"
          accept="application/pdf"
          class="form-file"
        />
      </div>
  
      <div class="form-actions">
        <button type="button" (click)="newArticle()" class="btn btn-new">
          Novo
        </button>
        <button type="button" (click)="save()" class="btn btn-save">
          {{ showLoading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
