<div class="container" style="margin-top: 70px; max-width: 900px;">

    <form autocomplete="off" #exameForm="ngForm">

        <div class="form-group">
            <label for="title">Titulo</label>
            <input type="text" id="title" name="title" [(ngModel)]="blog.title" minlength="1">
        </div>

        <!--<div [innerHTML]="blog.content"></div>-->

        <textarea id="editor"></textarea>

        <!--
        <div class="form-group">
            <label for="content">Conteúdo</label>
            <textarea id="content" name="content" ngModel #content="ngModel" required minlength="1" 
            [(ngModel)]="blog.content" rows="4"></textarea>
        </div>
        -->

        <div class="form-group">
            <label for="subject">Disciplina</label>
            <select id="subject" [(ngModel)]="blog.subject.id" name="subject" required>
              <option value="" disabled selected>Selecione a subject</option>
              <option *ngFor="let subject of subjects" [ngValue]="subject.id">{{ subject.name }}</option>
            </select>
        </div>

        <div class="form-group">
            <input type="file" (change)="onFileSelected($event)" name="file" accept="application/pdf" class="form-control"
              required />
        </div>

        <button type="button" (click)="newBlog()" class="btn">Novo</button>

        <button type="button" (click)="save()" class="btn">{{ showLoading ? 'Loading...' : 'Salvar' }}</button>

    </form>
</div>
