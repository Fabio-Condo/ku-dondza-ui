<div class="form-container">
    <form autocomplete="off" #exameForm="ngForm" class="blog-form">
      <div class="form-group">
        <label for="title">Título</label>
        <input
          type="text"
          id="title"
          name="title"
          [(ngModel)]="blog.title"
          minlength="1"
          placeholder="Digite o título do blog"
          class="form-input"
        />
      </div>
  
      <div class="form-group">
        <label for="editor">Conteúdo</label>
        <textarea
          id="editor"
          name="editor"
          placeholder="Escreva o conteúdo do blog"
          class="form-textarea"
        ></textarea>
      </div>
  
      <div class="form-group">
        <label for="subject">Disciplina</label>
        <select
          id="subject"
          [(ngModel)]="blog.subject.id"
          name="subject"
          required
          class="form-select"
        >
          <option value="" disabled selected>Selecione a disciplina</option>
          <option *ngFor="let subject of subjects" [ngValue]="subject.id">
            {{ subject.name }}
          </option>
        </select>
      </div>
  
      <div class="form-group">
        <label for="file">Anexar PDF</label>
        <input
          type="file"
          (change)="onFileSelected($event)"
          name="file"
          accept="application/pdf"
          class="form-file"
        />
      </div>
  
      <div class="form-actions">
        <button type="button" (click)="newBlog()" class="btn btn-new">
          Novo
        </button>
        <button type="button" (click)="save()" class="btn btn-save">
          {{ showLoading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>
    </form>
  </div>
