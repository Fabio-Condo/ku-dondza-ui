<div class="blog-container">
    <!-- Botão de Voltar -->
    <button class="back-button">
        <i class="pi pi-arrow-left"></i> Voltar
    </button>

    <!-- Título do Blog -->
    <h1 class="blog-title">{{ blog.title }}</h1>

    <!-- Data de Postagem -->
    <span class="blog-date">{{ blog.postDate | date: 'dd/MM/yyyy' }}</span>

    <!-- Conteúdo do Blog -->
    <div class="blog-content" [innerHTML]="blog.content"></div>

    <!-- Imagem do Blog -->
    <img *ngIf="blog.urlFile" [src]="blog.urlFile" alt="Imagem do blog" class="blog-image" />

    <!-- Seção de Interação (Like e Save) -->
    <div class="interaction-section">
        <!-- Botão de Like -->
        <button (click)="toggleLike(blog)" class="like-button" [class.liked]="blog.isLiked">
            <i class="pi" [ngClass]="blog.isLiked ? 'pi-heart-fill' : 'pi-heart'"></i>
            <span class="like-count">{{ 10 }}</span>
        </button>

        <!-- Botão de Save -->
        <button (click)="blog.isSaved ? onRemoveBlog(blog) : addBlogToSavedBlogs(blog)" class="save-button" [class.saved]="blog.isSaved">
            <i class="pi" [ngClass]="blog.isSaved ? 'pi-bookmark-fill' : 'pi-bookmark'"></i>
        </button>
    </div>
</div>
