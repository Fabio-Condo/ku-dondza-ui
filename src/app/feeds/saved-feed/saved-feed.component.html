<div class="container" style="margin-top: 120px;">
    <div style="display:inline;">
        <p style="margin-top: 20px; margin-bottom: 20px; font-size: 30px;">Posts guardados</p>
    </div>

    <p-table [value]="posts" (onLazyLoad)="aoMudarPagina($event)" [rows]="filtro.itensPorPagina"
        styleClass="p-datatable-sm" #tabela>

        <ng-template pTemplate="header">
            <tr>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-feed>
            <tr>
                <td style="width: 50px;">
                    <div>

                        <a href="javascript:;" [routerLink]="['/user/profile']">
                            <img class="w-5 sm:w-16rem xl:w-5rem shadow-5 block xl:block mx-auto border-round"
                                src="{{feed.urlFile}}" alt="" />
                        </a>

                    </div>
                </td>

                <td>
                    <p style="font-size: 0.8rem;" class="texto-limitado">{{ feed.text }}</p>
                    <p style="font-size: 0.8rem;">publicação: há {{timeElapsed(feed.date.toString())}}</p>

                    <div class="user-info">
                        <img src="{{feed.user.profileImageUrl}}" alt="User Image">
                        <span class="user-name">{{feed.user.firstName}} {{feed.user.lastName}}</span>
                    </div>

                    <a style="color: #1c80cf; font-size: 0.8rem; cursor: pointer;" (click)="removePostFromSavedPosts(feed)">remover</a>
                </td>

            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="10">
                    <span *ngIf="showLoading" style="color:#1c80cf;">Carregando... </span>
                    <span *ngIf="!showLoading">Nenhum post encontrado </span>
                    <i *ngIf="showLoading" class="pi pi-spin pi-spinner"></i>
                    <a href="javascript:;">
                        <i *ngIf="!showLoading" style="color: #1c80cf;" (click)="getSavedPosts(0)" pTooltip="Refresh"
                            class="pi pi-refresh"></i>
                    </a>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
