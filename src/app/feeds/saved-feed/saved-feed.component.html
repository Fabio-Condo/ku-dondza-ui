<div class="container" style="margin-top: 120px;">

    <div style="display:inline;">
        <p style="margin-top: 20px; margin-bottom: 20px; font-size: 30px;">Posts guardados
        <a style="color: #1c80cf; text-decoration: underline; font-size: 1rem; "
            [routerLink]="['/feed']">voltar</a></p>
    </div>

    <table class="card-table">
        <tbody>
            <tr *ngFor="let feed of posts">
                <td>
                    <div class="card">
                        <div class="card-content">
                            <div class="post-info">
                                <div *ngIf="isImageUrl(feed.urlFile)">
                                    <img [src]="feed.urlFile"
                                        style="width: 70px; height: 70px; margin-right: 10px; border-radius: 5px;"
                                        alt="">
                                </div>
                                <div>
                                    <video *ngIf="isVideoUrl(feed.urlFile)"
                                        style="width: 70px; height: 70px; margin-right: 10px; border-radius: 5px;">
                                        <!--controls-->
                                        <source [src]="feed.urlFile" type="video/mp4"
                                            style="width: 70px; height: 70px; margin-right: 10px; border-radius: 5px;">
                                        Your browser does not support the video tag.
                                    </video>
                                </div>

                                <div class="content">
                                    <p class="texto-limitado">{{ feed.text }}</p>
                                    <p>Publicação: há {{ timeElapsed(feed.date.toString()) }}</p>
                                    <div class="user-info" [routerLink]="['/user/profile', loggedUser.userId]">
                                        <img [src]="feed.user.profileImageUrl" alt="User Image">
                                        <span class="user-name">{{ feed.user.firstName }} {{ feed.user.lastName
                                            }}</span>
                                    </div>
                                    <a style="color: #1c80cf; font-size: 0.8rem; cursor: pointer;"
                                        (click)="removePostFromSavedPosts(feed)">remover</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Paginação -->
    <div style="margin-top: 20px;">
        <button class="pagination-button" (click)="previousPage()" [disabled]="currentPage === 1">Anterior</button>
        <span style="margin: 0 10px; font-size: 10px;">Página {{ currentPage }} de {{ totalPages() }}</span>
        <button class="pagination-button" (click)="nextPage()"
            [disabled]="currentPage === totalPages()">Próximo</button>
        <select class="select-itens-por-pagina" (change)="changePageSize($event)">
            <option *ngFor="let option of opcoesItensPorPagina" [value]="option"
                [selected]="option === filtro.itensPorPagina">{{ option }}</option>
        </select>
    </div>

    <!-- Indicador de carregamento -->
    <div *ngIf="showLoading" style="margin-top: 20px;">
        Carregando...
    </div>

</div>
