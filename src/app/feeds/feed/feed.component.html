<link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.6/css/unicons.css" />

<main>
  <div class="container">
    <div class="left">
      <div class="sidebar">
        <a class="menu-item active">
          <span><i class="uil uil-home"></i></span>
          <h3>Home</h3>
        </a>

        <a class="menu-item ">
          <span><i class="uil uil-setting"></i></span>
          <h3>Users</h3>
        </a>
      </div>
    </div>



    <div class="middle">

      <form class="create-post" #newPostForm="ngForm" (ngSubmit)="onAddPostUser(newPostForm)">
        <div class="profile-pic">
          <img src="{{imagePath}}/profile-1.jpg" alt="">
        </div>
        <input style="margin-left: 10px;" type="text" placeholder="Start the post" id="create-post" name="text" [(ngModel)]="post.text">
        <div class="">
          <input type="file" id="upload-button" multiple accept="**" name="postImage"
            (change)="onPostImageChange($event, $event)" />
          <label for="upload-button">
            <i></i>file
          </label>
        </div>

      </form>

      <div class="feeds">
        <div class="feed" *ngFor="let feed of feeds">
          <div class="user">
            <div class="profile-pic">
              <img src="{{imagePath}}/profile-1.jpg" alt="">
            </div>
            <div class="info">
              <a style="color:hsl(252, 30%, 10%);">
                <h3>fabio condo</h3>
              </a>
              <small>fabio condo, {{feed.date | date:'dd/MM/y'}} </small>
            </div>
            <span class="edit"><i class="uil uil-ellipsis-h"></i></span>
          </div>

          <hr style="margin-top: 5px;">

          <div style="margin-top: 1em;">{{feed.text}}</div>

          <div class="photo">
            <img src="{{feed.urlFile}}" alt="">
          </div>

          <div class="action-button">
            <div class="interaction-button">
              <a style="cursor: pointer;"><i class="uil uil-thumbs-up"></i></a>
              <a style="cursor: pointer;"><i class="uil uil-comment" (click)="toggleComments(feed)"></i></a>
              <i class="uil uil-share"></i>
            </div>
            <div class="bookmark">
              <i class="uil uil-bookmark"></i>
            </div>
          </div>

          <div class="liked-by">
            <!-- Seção de likes, se necessário -->
          </div>

          <hr style="margin-bottom: 1rem;">

          <form class="create-post" #newCommentForm="ngForm">
            <div class="profile-pic">
              <img src="{{imagePath}}/profile-1.jpg" alt="">
            </div>
            <input type="text" style="height: 30px; background-color: #fff; border-radius: 10px; margin-left: 10px;" placeholder="Add your comment here" ngModel name="comment">
            
            <div>
              <button class="btn btn-primary" style="padding: 0.4rem 1rem;">Publicar</button>
            </div>
            
          </form>
          

          <div class="comments" *ngIf="feed.showComments">
            <div *ngFor="let comment of feed.comments" class="comment-box">

              <div class="comment">

                <div style="display: flex; align-items: flex-start;">
                  <div style="width: 1.5rem; aspect-ratio: 1/1; border-radius: 50%; overflow: hidden; margin-right: 10px;">
                    <img src="{{imagePath}}/profile-1.jpg" alt="">
                  </div>
                  <div class="info">
                    <a style="color:hsl(252, 30%, 10%); text-decoration: none;">
                      <h4 style="margin: 0;">fabio condo</h4>
                    </a>
                    <p style="background-color: #e4e5e8; border: 1px solid rgb(198, 197, 197); padding: 10px; border-radius: 10px; margin: 5px 0;">{{comment.content}}</p>
                    <a href="javascript:;" style="color: hsl(252, 30%, 40%); text-decoration: none; margin-right: 10px;" >Gosto</a>
                    <a href="javascript:;" (click)="toggleReplyForm(comment)" style="color: hsl(252, 30%, 40%); text-decoration: none;">Responder</a>
                  </div>
                </div>
                

                <div class="comment-content">
                  <!--
                  <p style="background-color: #e4e5e8; padding: 10px 10px;">{{comment.content}}</p>
                  <a href="javascript:;" (click)="toggleReplyForm(comment)">Reply</a>
                  -->
                </div>

                <form class="create-post" #newCommentForm="ngForm" *ngIf="comment.showReplyForm">
                  <div class="profile-pic">
                    <img src="{{imagePath}}/profile-1.jpg" alt="">
                  </div>
                  <input type="text" style="height: 30px; background-color: #fff; border-radius: 10px; margin-left: 10px;" placeholder="Add your comment here" ngModel name="comment">
                  
                  <div>
                    <button class="btn btn-primary" style="padding: 0.4rem 1rem;">responder</button>
                  </div>
                </form>
                
                <div class="replies">
                  <div *ngFor="let reply of comment.replies" class="comment-box reply">

                    <div class="comment">

                      <div style="display: flex; align-items: flex-start;">
                        <div style="width: 1.5rem; aspect-ratio: 1/1; border-radius: 50%; overflow: hidden; margin-right: 10px;">
                          <img src="{{imagePath}}/profile-1.jpg" alt="">
                        </div>
                        <div class="info">
                          <a style="color:hsl(252, 30%, 10%); text-decoration: none;">
                            <h4 style="margin: 0;">fabio condo</h4>
                          </a>
                          <p style="background-color: #e4e5e8; border: 1px solid rgb(198, 197, 197); padding: 10px; border-radius: 10px; margin: 5px 0;">{{comment.content}}</p>
                          <a href="javascript:;" style="color: hsl(252, 30%, 40%); text-decoration: none; margin-right: 10px;" >Gosto</a>
                          <a href="javascript:;" (click)="toggleReplyForm(reply)" style="color: hsl(252, 30%, 40%); text-decoration: none;">Responder</a>
                        </div>
                      </div>

                      <form class="create-post" #newCommentForm="ngForm" *ngIf="reply.showReplyForm">
                        <div class="profile-pic">
                          <img src="{{imagePath}}/profile-1.jpg" alt="">
                        </div>
                        <input type="text" style="height: 30px; background-color: #fff; border-radius: 10px; margin-left: 10px;" placeholder="Add your comment here" ngModel name="comment">
                        
                        <div>
                          <button class="btn btn-primary" style="padding: 0.4rem 1rem;">responder</button>
                        </div>
                      </form>

                      <div class="replies">
                        <div *ngFor="let rep of reply.replies" class="comment-box reply">
                          <div class="comment">

                            <div style="display: flex; align-items: flex-start;">
                              <div style="width: 1.5rem; aspect-ratio: 1/1; border-radius: 50%; overflow: hidden; margin-right: 10px;">
                                <img src="{{imagePath}}/profile-1.jpg" alt="">
                              </div>
                              <div class="info">
                                <a style="color:hsl(252, 30%, 10%); text-decoration: none;">
                                  <h4 style="margin: 0;">fabio condo</h4>
                                </a>
                                <p style="background-color: #e4e5e8; border: 1px solid rgb(198, 197, 197); padding: 10px; border-radius: 10px; margin: 5px 0;">{{comment.content}}</p>
                              </div>
                            </div>
                            
                            <div class="replies">
                              <!-- Further nesting of replies if needed -->
                            </div>

                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div>
            <a class="text-muted" href="javascript:;">View all comments</a>
          </div>
        </div>
      </div>

    </div>

    <div class="right">

      <div class="messages">
        <h4>Requests</h4>
        <div class="request">
          <div class="info">
            <div class="profile-pic">
              <a href="javascript:;"><img src="{{imagePath}}/profile-1.jpg"></a>
            </div>
            <div>
              <a>
                <h5>fabio condo</h5>
              </a>
              <p class="text-muted">8 mutual friends</p>
            </div>
          </div>
          <div class="action">
            <button class="btn btn-primary">Accept</button>
            <button class="btn">Decline</button>
          </div>
        </div>

      </div>

      <br>

      <div class="messages">
        <div class="heading">
          <h4>Friends</h4>
        </div>

        <div class="search-bar">
          <span><i class="uil uil-search"></i></span>
          <input type="search" placeholder="Search Friends" id="message-search">
        </div>

        <div class="message">
        </div>

      </div>

      <br>


      <div class="messages">
        <div class="heading">
          <h4>Users</h4>
        </div>


      </div>

    </div>

  </div>
</main>
