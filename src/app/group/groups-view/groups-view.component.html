<div class="container" style="margin-top: 70px;">

    <!-- Cabeçalho das Abas -->
    <div class="tab-header">
        <div class="tab-link" [class.active]="activeTab === 1" (click)="setActiveTab(1)">
            Descrição
        </div>
        <div class="tab-link" [class.active]="activeTab === 2" (click)="setActiveTab(2)">
            Membros
        </div>
        <div class="tab-link" [class.active]="activeTab === 3" (click)="setActiveTab(3)">
            Publicações
        </div>
    </div>

    <!-- Conteúdo das Abas -->
    <div *ngIf="activeTab === 1" class="active">
        <div class="institution-container">
            <div class="institution-image-container">
              <img [src]="group.urlFile" alt="{{ group.name }}" class="institution-image" />
            </div>
            
            <div class="institution-details">
                <h1 class="institution-title">{{ group.name }}</h1>
                <p class="institution-description">{{ group.description }}</p>
                
                <div class="institution-meta">

                </div>
                
                <button class="enroll-button" (click)="addMemberToGroup(group)" *ngIf="!group.isMember">Aderir o grupo</button>
                <button class="enroll-button" (click)="onRemoveMember(group)" *ngIf="group.isMember">Sair do grupo</button>

            </div>
        </div>
    </div>

    <div *ngIf="activeTab === 2" class="active">
        Membros
    </div>

    <div *ngIf="activeTab === 3" class="active">
        <table class="card-table">
            <tbody>
                <tr *ngFor="let feed of feeds">
                    <td>
                        <div class="card">
                            <div class="card-content">
                                <div class="content">
                                    <p class="subject-name">{{ feed.text }}</p>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <!-- Indicador de carregamento -->
        <div *ngIf="showLoading" class="loading-indicator">
            Carregando...
        </div>
    </div>

</div>

<!-- confirm dialog -->
<div class="dialog-overlay" *ngIf="showConfirmDialog">
    <div class="dialog">
        <div class="dialog-header">
            <h4>Deseja sair do grupo ?</h4>
            <button class="close-button" (click)="closeConfirmDialog()">x</button>
        </div>
        <div class="dialog-content">
            <ng-content></ng-content>
        </div>
        <div class="dialog-footer">
            <button (click)="confirmDialog(selectedGroup)">Confirmar</button>
            <button (click)="closeConfirmDialog()">Cancelar</button>
        </div>
    </div>
</div>
