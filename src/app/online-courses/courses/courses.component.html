<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popout de Likes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .trigger-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            transition: all 0.3s ease;
        }

        .trigger-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .heart-icon {
            color: #e74c3c;
            font-size: 18px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay.show {
            display: flex;
            opacity: 1;
        }

        .popout {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            height: 600px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .overlay.show .popout {
            transform: scale(1);
        }

        .popout-header {
            padding: 24px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .heart-badge {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .header-text h2 {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .header-text p {
            font-size: 14px;
            color: #7f8c8d;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f8f9fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6c757d;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: #e9ecef;
            color: #495057;
        }

        .users-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e0 transparent;
        }

        .users-container::-webkit-scrollbar {
            width: 6px;
        }

        .users-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .users-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .users-container::-webkit-scrollbar-thumb:hover {
            background: #a0aec0;
        }

        .user-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            transition: background 0.2s ease;
            margin-bottom: 8px;
        }

        .user-item:hover {
            background: #f8f9fa;
        }

        .user-avatar {
            position: relative;
            flex-shrink: 0;
        }

        .user-avatar img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .verified-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            border: 2px solid white;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 15px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-username {
            color: #7f8c8d;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .follow-btn {
            padding: 8px 16px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .follow-btn:hover {
            background: #34495e;
            transform: translateY(-1px);
        }

        .load-more-container {
            padding: 24px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
        }

        .load-more-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .load-more-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .load-more-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .popout {
                height: 80vh;
                max-height: 600px;
            }

            .popout-header {
                padding: 20px;
            }

            .users-container {
                padding: 0 20px;
            }

            .load-more-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <button class="trigger-btn" onclick="openPopout()">
        <span class="heart-icon">❤️</span>
        <span>147 likes</span>
    </button>

    <div class="overlay" [ngClass]="{ 'show': visible }" (click)="onOverlayClick($event)">
        <div class="popout" (click)="$event.stopPropagation()">
            <div class="popout-header">
                <div class="header-info">
                    <div class="heart-badge">❤️</div>
                    <div class="header-text">
                        <h2>Curtidas</h2>
                        <p><span>{{ totalLikes }}</span> pessoas curtiram</p>
                    </div>
                </div>
                <button class="close-btn" (click)="closePopout()">×</button>
            </div>

            <div class="users-container">
                <div class="user-item" *ngFor="let user of users">
                    <div class="user-avatar">
                        <img [src]="user.avatar" [alt]="user.name">
                        <div *ngIf="user.verified" class="verified-badge">✓</div>
                    </div>
                    <div class="user-info">
                        <div class="user-name">{{ user.name }}</div>
                        <div class="user-username">{{ user.username }}</div>
                    </div>
                    <button class="follow-btn">Seguir</button>
                </div>
            </div>

            <div class="load-more-container">
                <button class="load-more-btn">
                    <span>Carregar mais</span>
                </button>
            </div>
        </div>
    </div>

</body>

</html>
