<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competições</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #4361ee;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #4361ee;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
        }

        .competitions-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .competition-card {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            width: 100%;
        }

        .competition-card:hover {
            box-shadow: 0 4px 16px rgba(67, 97, 238, 0.15);
            border-color: #4361ee;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .competition-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin: 0;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-active {
            background: #4361ee;
            color: white;
        }

        .status-inactive {
            background: #dc3545;
            color: white;
        }

        .card-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        .main-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
        }

        .difficulty-level {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .difficulty-dots {
            display: flex;
            gap: 0.3rem;
        }

        .difficulty-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .difficulty-dot.filled {
            background: #4361ee;
        }

        .stats-sidebar {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #4361ee;
        }

        .stats-title {
            font-size: 1rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .stat-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: #4361ee;
        }

        .topics-section {
            grid-column: 1 / -1;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .topics-title {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .topics-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .topic-tag {
            background: #4361ee;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .expiry-info {
            color: #dc3545;
            font-weight: 600;
        }

        .expiry-info.valid {
            color: #28a745;
        }

        @media (max-width: 768px) {
            .card-content {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .main-info {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Competições</h1>
            <p>Lista de competições disponíveis</p>
        </div>

        <div class="competitions-list" id="competitionsList">
            <!-- As competições serão inseridas aqui via JavaScript -->
        </div>
    </div>

    <script>
        // Dados de exemplo das competições
        const competitions = [
            {
                title: "Desafio de Algoritmos Avançados",
                expiry: "2025-06-15",
                active: true,
                difficultyLevel: 4,
                subject: "Ciência da Computação",
                questions: 25,
                submissions: 1247,
                topics: ["Estruturas de Dados", "Grafos", "Programação Dinâmica", "Algoritmos"]
            },
            {
                title: "Competição de Machine Learning",
                expiry: "2025-07-20",
                active: true,
                difficultyLevel: 5,
                subject: "Inteligência Artificial",
                questions: 15,
                submissions: 892,
                topics: ["Deep Learning", "Neural Networks", "Computer Vision", "NLP"]
            },
            {
                title: "Hackathon de Desenvolvimento Web",
                expiry: "2025-05-25",
                active: false,
                difficultyLevel: 3,
                subject: "Desenvolvimento",
                questions: 18,
                submissions: 2156,
                topics: ["React", "Node.js", "MongoDB", "CSS", "JavaScript"]
            },
            {
                title: "Desafio de Matemática Aplicada",
                expiry: "2025-08-10",
                active: true,
                difficultyLevel: 4,
                subject: "Matemática",
                questions: 30,
                submissions: 634,
                topics: ["Cálculo", "Álgebra Linear", "Estatística", "Probabilidade"]
            },
            {
                title: "Competição de Cybersecurity",
                expiry: "2025-06-30",
                active: true,
                difficultyLevel: 5,
                subject: "Segurança",
                questions: 20,
                submissions: 578,
                topics: ["Ethical Hacking", "Cryptography", "Network Security", "Forensics"]
            },
            {
                title: "Desafio de Data Science",
                expiry: "2025-04-15",
                active: false,
                difficultyLevel: 3,
                subject: "Ciência de Dados",
                questions: 22,
                submissions: 1893,
                topics: ["Python", "Pandas", "Matplotlib", "SQL", "Statistics"]
            }
        ];

        function getDifficultyDots(level) {
            let dots = '';
            for (let i = 1; i <= 5; i++) {
                const filled = i <= level ? 'filled' : '';
                dots += `<div class="difficulty-dot ${filled}"></div>`;
            }
            return dots;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const isExpired = date < now;
            const className = isExpired ? 'expiry-info' : 'expiry-info valid';
            
            return `<span class="${className}">${date.toLocaleDateString('pt-BR')}</span>`;
        }

        function createCompetitionCard(competition) {
            return `
                <div class="competition-card">
                    <div class="card-header">
                        <h3 class="competition-title">${competition.title}</h3>
                        <div class="status-badge ${competition.active ? 'status-active' : 'status-inactive'}">
                            ${competition.active ? 'Ativa' : 'Encerrada'}
                        </div>
                    </div>

                    <div class="card-content">
                        <div class="main-info">
                            <div class="info-item">
                                <span class="info-label">Matéria</span>
                                <span class="info-value">${competition.subject}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Encerramento</span>
                                <span class="info-value">${formatDate(competition.expiry)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Dificuldade</span>
                                <div class="difficulty-level">
                                    <div class="difficulty-dots">
                                        ${getDifficultyDots(competition.difficultyLevel)}
                                    </div>
                                    <span class="info-value">${competition.difficultyLevel}/5</span>
                                </div>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Total de Questões</span>
                                <span class="info-value">${competition.questions}</span>
                            </div>
                        </div>

                        <div class="stats-sidebar">
                            <div class="stats-title">Estatísticas</div>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-label">Submissões</span>
                                    <span class="stat-number">${competition.submissions.toLocaleString()}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Questões</span>
                                    <span class="stat-number">${competition.questions}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">Tópicos</span>
                                    <span class="stat-number">${competition.topics.length}</span>
                                </div>
                            </div>
                        </div>

                        <div class="topics-section">
                            <div class="topics-title">Tópicos</div>
                            <div class="topics-list">
                                ${competition.topics.map(topic => `<span class="topic-tag">${topic}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCompetitions() {
            const list = document.getElementById('competitionsList');
            list.innerHTML = competitions.map(createCompetitionCard).join('');
        }

        // Renderizar as competições quando a página carregar
        document.addEventListener('DOMContentLoaded', renderCompetitions);
    </script>
</body>
</html>
