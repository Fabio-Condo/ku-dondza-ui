<section class="testimonials">
    <div class="container">
      <div class="section-title">
        <h2>Depoimentos</h2>
        <p>Veja o que nossos usuários dizem sobre a EduConnect</p>
      </div>
  
      <div class="slider-wrapper">
        <button class="slider-btn prev-btn" (click)="scroll('prev')">&#10094;</button>
  
        <div class="testimonials-slider" #slider>
          <div class="testimonial-card" *ngFor="let testimonial of testimonials">
            <p>{{ testimonial.text }}</p>
            <div class="testimonial-author">
              <h4>{{ testimonial.author }}</h4>
              <p>{{ testimonial.role }}</p>
            </div>
          </div>
        </div>
  
        <button class="slider-btn next-btn" (click)="scroll('next')">&#10095;</button>
      </div>
    </div>
  </section>
