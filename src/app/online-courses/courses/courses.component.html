<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Layout Responsivo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #ccc;
      flex-wrap: wrap;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
    }

    .info {
      font-size: 14px;
      color: #666;
      margin-top: 8px;
      flex-basis: 100%;
    }

    .actions button {
      margin-left: 8px;
    }

    .card-list {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      background-color: #f9f9f9;
    }

    /* --- Estilos para dispositivos menores --- */
    @media (max-width: 600px) {
      header {
        padding: 8px 12px;
      }

      .title {
        font-size: 18px;
      }

      .info {
        display: none;
      }

      .actions button:not(.filter-btn) {
        display: none;
      }

      .card-list {
        padding: 8px;
        grid-template-columns: 1fr;
      }

      .fab {
        position: fixed;
        bottom: 16px;
        right: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        width: 56px;
        height: 56px;
        font-size: 24px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        cursor: pointer;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title">Meus Itens</div>
    <div class="actions">
      <button class="filter-btn">Filtrar</button>
      <button class="add-btn">Adicionar</button>
    </div>
    <div class="info">Mostrando 10 de 100 itens</div>
  </header>

  <main class="card-list">
    <div class="card">Item 1</div>
    <div class="card">Item 2</div>
    <div class="card">Item 3</div>
    <div class="card">Item 4</div>
    <!-- ... -->
  </main>

  <button class="fab">+</button>

</body>
</html>
