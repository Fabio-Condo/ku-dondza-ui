<div class="container" style="margin-top: 70px;">

    <div style="display: inline-block; vertical-align: top; margin-right: 20px;">

        <p style="margin: 0; font-size: 30px;">{{course.name}}</p>

    </div>

    <div>
        <video class="video" #videoPlayer controls>
            <source [src]="onlineSelectedCourseContent.urlFile" type="video/mp4"> 
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="flex">
        <div>
            <p class="course-name">{{ onlineSelectedCourseContent.description }}</p>
        </div>
        <div>
            <a *ngIf="isAdmin" (click)="onAddNewOnlineCourseContent()" class="ml-left">Adicionar</a>
        </div>
    </div>


    <table class="card-table">
        <tbody>
            <tr *ngFor="let content of onlineCourseContentList">
                <td>
                    <div class="card">
                        <div class="card-content" (click)="onSelectContent(content)" (click)="scrollToTop()">
                            <div>
                                <video 
                                    style="width: 70px; height: 40px; border-radius: 5px; border: 1px solid #ccc;">
                                    <source [src]="content.urlFile" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            </div>
                            
                            <div class="content">
                                <p class="course-name">{{ content.description }}</p>
                                <a (click)="onUpdateOnlineCourseContent(content, file)"
                                class="edit-link">editar</a>
                                <a (click)="confirmarExclusao(content)" class="delete-link">excluir</a>
                            </div>
                            <p *ngIf="onlineSelectedCourseContent == content"><i class="pi pi-play" style="font-size: 1rem;"></i></p>
                        </div>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Paginação -->
    <div class="pagination-controls">
        <button class="pagination-button" (click)="previousPage()" [disabled]="currentPage === 1">Anterior</button>
        <span class="pagination-info">Página {{ currentPage }} de {{ totalPages() }}</span>
        <button class="pagination-button" (click)="nextPage()"
            [disabled]="currentPage === totalPages()">Próximo</button>
        <select class="select-itens-por-pagina" (change)="changePageSize($event)">
            <option *ngFor="let option of opcoesItensPorPagina" [value]="option"
                [selected]="option === filtro.itensPorPagina">{{ option }}</option>
        </select>
    </div>

    <!-- Indicador de carregamento -->
    <div *ngIf="showLoading" class="loading-indicator">
        Carregando...
    </div>

</div>

<div class="overlay" *ngIf="displayModalSave">
    <div class="dialog">
        <h2>{{ editing ? 'Editando Instituição' : 'Adicionando Nova Instituição' }}</h2>

        <button class="close-btn" (click)="displayModalSave = false">&times;</button>

        <hr>

        <form autocomplete="off" #courseForm="ngForm">

            <div class="form-group">
                <label for="description">Descrição</label>
                <input type="text" name="description" ngModel #description="ngModel" required minlength="1"
                    [(ngModel)]="onlineCourseContent.description">
            </div>

            <div class="form-group">
                <input type="file" (change)="onFileSelected($event)" name="file" accept="application/**"
                    class="form-control" required />
            </div>

            <div class="form-group">
                <button type="button" (click)="save()" class="btn">{{ showLoading ? 'Loading...' : 'Salvar' }}</button>
            </div>
        </form>
    </div>
</div>
