<app-navbar *ngIf="showNavbar()"></app-navbar>
<router-outlet></router-outlet>

<p-toast></p-toast>

<p-confirmDialog header="Confirmation" icon="pi pi-question-circle" #confirmacao> 
  <p-footer>
    <button type="button" style="background-color: #3734ed; border-color: #3734ed;" pButton icon="pi pi-check" label="Yes"
      (click)="confirmacao.accept()"></button> 
    <button class="p-button-outlined" style="color: #3734ed;" type="button" pButton icon="pi pi-times" label="No"
      (click)="confirmacao.reject()"></button> 
  </p-footer>
</p-confirmDialog>

<app-footer *ngIf="showFooter()"></app-footer>
